name: copy-runtime-glbs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/fase2-godot-slice
          fetch-depth: 0

      - name: Copy GLBs into runtime/models
        run: |
          set -euo pipefail
          mkdir -p runtime/models
          # CIN-001 totem from main @ d93f777 (ASSET OK)
          git checkout origin/main -- runtime/models/totem_warp_cuyabeno.glb
          # hero + floor from greybox sources already on this branch
          cp -f assets/greybox/heroes/hero_grey.glb runtime/models/hero_grey.glb
          cp -f assets/greybox/worlds/selva/chunk_selva_floor.glb runtime/models/chunk_selva_floor.glb
          sha256sum runtime/models/*.glb

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/models/totem_warp_cuyabeno.glb \
                  runtime/models/hero_grey.glb \
                  runtime/models/chunk_selva_floor.glb
          if git diff --cached --quiet; then
            echo "No GLB changes to commit"
            exit 0
          fi
          git commit -m "feat(fase2): copy totem/hero/floor GLBs into runtime/models"
          git push origin HEAD:feat/fase2-godot-slice
